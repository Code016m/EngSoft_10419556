# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

# Nome do workflow (aparece na aba Actions do GitHub)
name: Build and deploy Python app to Azure Web App - engsoft-aula6-10419556

# Define quando o workflow será executado
on:
  push:
    branches:
      - 'main'  # Executa automaticamente quando há push na branch main
  workflow_dispatch:  # Permite execução manual pelo GitHub

# Definição dos jobs (tarefas do pipeline)
jobs:
  # JOB DE BUILD (preparação da aplicação)
  build:
    runs-on: ubuntu-latest  # Máquina virtual Linux usada para executar o job
    permissions:  # Permissão necessária para ler o código do repositório
        contents: read  #This is required for actions/checkout

    steps:
      # Faz download (checkout) do código do repositório
      - uses: actions/checkout@v4
      
      # STEP ADICIONADO (ANTES DO BUILD)
      # Imprime a mensagem solicitada no console da pipeline
      - name: Mensagem inicial
        run: echo "Iniciando o deploy do meu projeto!"

      # Configura a versão do Python que será usada
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'  # Define a versão do Python

      # 🛠️ Local Build Section (Optional)
      # Esta etapa ajuda a identificar problemas de instalação antes do deploy.
      # Pode facilitar a depuração caso existam problemas nas dependências.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # O Azure pode utilizar o Oryx para instalar as dependências durante o deploy.
      # Por isso, o ambiente virtual antenv é excluído do artefato para reduzir seu tamanho.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app  # Nome do artefato que será enviado para o próximo job
          # Inclui os arquivos do projeto e exclui o ambiente virtual.
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # Estas observações se referem à possibilidade de desativar o processo Oryx.
      # Consulte a documentação antes de alterar essa configuração.
      # https://github.com/Azure/actions-workflow-samples/tree/master/AppService

  # JOB DE DEPLOY (implantação na Azure)
  deploy:
    runs-on: ubuntu-latest  # Máquina onde o deploy será executado
    needs: build  # Esse job só roda após o build terminar com sucesso

    steps:
      # Baixa o artefato gerado no job de build
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app  # Nome do artefato salvo anteriormente

      # Realiza o deploy da aplicação no Azure App Service
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp  # Identifica este step no workflow
        with:
          app-name: 'engsoft-aula6-10419556'  # Nome do App Service criado na Azure
          slot-name: 'Production'  # Slot padrão de produção
          # Utiliza o segredo do GitHub com as credenciais de publicação
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_34F1A5ADC68E4FC08F3C9B9FAEF42481 }}
